# Tests and builds the Android client. Protocol fixtures changes run it too:
# its tests decode them.
name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "protocol/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "protocol/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  android:
    name: Android client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
